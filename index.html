<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Take Home Assignment</title>
<style>
  :root{
    --bg:#0a0c1b;--panel:#141a2f;--accent:#3b82f6;--accent2:#8b5cf6;
    --good:#22c55e;--bad:#ef4444;--text:#e5e7eb;--muted:#94a3b8;--ok:#facc15;
  }
  *{box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
  body{margin:0;background:linear-gradient(160deg,var(--panel),#0f172a);color:var(--text);
       display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:30px;}
  h1{color:var(--accent);margin-bottom:10px;text-align:center;}
  .app{max-width:700px;width:100%;background:rgba(255,255,255,0.04);padding:24px;border-radius:16px;
       box-shadow:0 8px 20px rgba(0,0,0,0.3);}
  .progress-section{text-align:center;margin-top:10px;}
  .progress-text{color:var(--muted);font-size:0.9rem;margin-bottom:4px;}
  .progress-container{width:100%;background:rgba(255,255,255,0.1);border-radius:10px;height:10px;overflow:hidden;}
  .progress-bar{height:10px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.4s ease;}
  .question{font-weight:700;font-size:1.2rem;margin:16px 0;}
  .choices{display:flex;gap:10px;margin-top:8px;}
  .btn{flex:1;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;
       background:var(--panel);color:var(--text);transition:all 0.2s;}
  .btn:hover{background:var(--accent);color:#fff;transform:translateY(-2px);}
  .primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;}
  .feedback{margin-top:14px;min-height:24px;font-weight:600;}
  .correct{color:var(--good);}
  .wrong{color:var(--bad);}
  .footer{text-align:center;margin-top:20px;color:var(--muted);}
  input{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);
       background:rgba(255,255,255,0.05);color:var(--text);}
  .hidden{display:none;}
  #summary{display:none;text-align:center;margin-top:20px;}
  #summary h2{color:var(--accent);}
  #rating{font-size:1.1rem;margin-top:8px;font-weight:bold;}
  .excellent{color:var(--good);}
  .good{color:var(--ok);}
  .tryagain{color:var(--bad);}
</style>
</head>
<body>

<div class="app">
    <h1>Take Home Assignment</h1>
    <p class="muted" style="text-align:center;">Answer true or false, and learn why.</p>

    <div id="namePrompt">
      <h3 style="text-align:center;">Enter your name to begin:</h3>
      <input id="userName" placeholder="Your full name">
      <button id="startBtn" class="btn primary" style="margin-top:10px;width:100%;">Start Quiz</button>
    </div>

    <div class="progress-section hidden" id="progressSection">
      <div id="progressText" class="progress-text"></div>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <div id="quizArea" class="hidden">
      <div id="question" class="question"></div>
      <div class="choices">
        <button id="btnTrue" class="btn">True</button>
        <button id="btnFalse" class="btn">False</button>
      </div>
      <div id="feedback" class="feedback"></div>
      <div style="text-align:center;margin-top:15px;">
        <button id="nextBtn" class="btn primary" style="display:none;">Next ➜</button>
      </div>
    </div>

    <div id="summary">
      <h2>Quiz Complete 🎉</h2>
      <p id="scoreText"></p>
      <div id="rating"></div>
      <p id="saveStatus" style="margin-top:10px;"></p>
      <button id="restartBtn" class="btn primary" style="margin-top:15px;">Restart Quiz</button>
    </div>

    <div class="footer">Results automatically saved to Google Sheet (admin only)</div>
</div>

<script>

const SHEET_URL = "https://script.google.com/macros/s/AKfycbwUsuf9SESCtU-UgWBCFDsk94MQfdVu6EnEga4RAkb5XmK_xRGCjC6xnIvEqL-3S2Gt/exec";

const questions = [
  {q:"If a celebrity posted information about the world, it's 100% real and can be trusted.",a:false,e:"What celebrities post may not always be true; they can also be used to spread misinformation."},
  {q:"Fake news can spread faster than real news.",a:true,e:"People often believe shocking fake news quickly and share it without checking."},
  {q:"Every piece of information online is trustworthy.",a:false,e:"People or bots can create fake news using editing tools or AI."},
  {q:"You should always check the source before spreading information.",a:true,e:"You should always verify information so you don’t accidentally spread fake news."},
  {q:"If a post has many likes and comments, it's guaranteed to be real.",a:false,e:"Popularity does not guarantee truth."},
  {q:"If a post includes real pictures, it must be real.",a:false,e:"Pictures can be edited or taken out of context."},
  {q:"Fake videos or pictures are impossible to detect.",a:false,e:"Fakes can often be spotted through unnatural movement, lighting, or background issues."},
  {q:"It’s okay to share an article without reading it, as long as the title sounds true.",a:false,e:"Headlines can be misleading — always read the full article before sharing."},
  {q:"Bots or fake accounts can help spread fake news.",a:true,e:"Fake accounts can be programmed to spread misleading information quickly."},
  {q:"Images and videos on social media are always reliable evidence.",a:false,e:"Nowadays, AI tools can create fake images and videos that look real."}
];

let idx=0, score=0, userName="", userAnswers=[];

const qEl = document.getElementById("question");
const feedback = document.getElementById("feedback");
const btnT = document.getElementById("btnTrue");
const btnF = document.getElementById("btnFalse");
const nextBtn = document.getElementById("nextBtn");
const summary = document.getElementById("summary");
const scoreText = document.getElementById("scoreText");
const ratingEl = document.getElementById("rating");
const restartBtn = document.getElementById("restartBtn");
const quizArea = document.getElementById("quizArea");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const namePrompt = document.getElementById("namePrompt");
const progressSection = document.getElementById("progressSection");
const saveStatus = document.getElementById("saveStatus");
const startBtn = document.getElementById("startBtn");

startBtn.onclick = () => {
  userName = document.getElementById("userName").value.trim();
  if(!userName) return alert("Please enter your name first.");
  namePrompt.classList.add("hidden");
  quizArea.classList.remove("hidden");
  progressSection.classList.remove("hidden");
  renderQuestion();
};

function renderQuestion(){
  const q = questions[idx];
  qEl.textContent = (idx+1) + ". " + q.q;
  feedback.textContent = "";
  btnT.disabled = btnF.disabled = false;
  nextBtn.style.display = "none";
  updateProgress();
}

function updateProgress(){
  const percent = (idx/questions.length)*100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${idx+1} of ${questions.length}`;
}

function answer(isTrue){
  const q = questions[idx];
  const correct = q.a === isTrue;
  userAnswers.push({question:q.q, answer:isTrue, correct});
  btnT.disabled = btnF.disabled = true;
  feedback.textContent = (correct?"✅ Correct — ":"❌ Wrong — ") + q.e;
  feedback.className = "feedback " + (correct?"correct":"wrong");
  nextBtn.style.display = "inline-block";
  if(correct) score++;
}

function next(){
  idx++;
  if(idx >= questions.length){
    progressBar.style.width = "100%";
    showSummary();
  } else renderQuestion();
}

function showSummary(){
  quizArea.style.display="none";
  summary.style.display="block";
  const percent = Math.round((score/questions.length)*100);
  scoreText.textContent = `${userName}, you scored ${score} out of ${questions.length} (${percent}%)`;

  if(percent >= 80){
    ratingEl.textContent = "Excellent work! 🌟";
    ratingEl.className = "excellent";
  } else if(percent >= 50){
    ratingEl.textContent = "Good effort! 👍";
    ratingEl.className = "good";
  } else {
    ratingEl.textContent = "Try again — you’ve got this! 💪";
    ratingEl.className = "tryagain";
  }

  fetch(SHEET_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name:userName,
      score:score,
      total:questions.length,
      percent:percent,
      answers:userAnswers
    })
  })
  .then(r=>r.json())
  .then(()=> saveStatus.textContent="✅ Result saved to Google Sheet")
  .catch(()=> saveStatus.textContent="⚠️ Could not save result.");
}

function restartQuiz(){
  idx=0; score=0; userAnswers=[];
  summary.style.display="none";
  quizArea.style.display="block";
  renderQuestion();
}

btnT.onclick=()=>answer(true);
btnF.onclick=()=>answer(false);
nextBtn.onclick=next;
restartBtn.onclick=restartQuiz;

</script>

</body>
</html>
